<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TatameOne</title>
  <style>
    body { background-color: #121214; color: #ffffff; font-family: sans-serif; margin: 0; padding: 15px; }
    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { margin: 0; color: #ff334b; }
    .header p { color: #8d8d99; font-size: 0.9rem; margin-top: 5px; }
    .tabs { display: flex; gap: 8px; justify-content: center; margin-bottom: 20px; position: relative; z-index: 10; }
    .tab-btn { background-color: #202024; border: 1px solid #323238; color: #c4c4cc; padding: 12px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; flex: 1; max-width: 130px; text-align: center; font-size: 0.85rem; -webkit-tap-highlight-color: transparent; }
    .tab-btn.active { background-color: #ff334b; color: #ffffff; border-color: #ff334b; }
    .tab-content { display: none; background: #202024; padding: 16px; border-radius: 8px; border: 1px solid #323238; }
    .tab-content.active { display: block !important; }
    label { display: block; margin-top: 10px; font-size: 0.85rem; color: #a8a8b3; }
    input, select, button.form-btn { width: 100%; padding: 10px; margin-top: 5px; border-radius: 4px; border: 1px solid #323238; background: #121214; color: #fff; box-sizing: border-box; }
    button.form-btn { background: #ff334b; font-weight: bold; border: none; margin-top: 15px; cursor: pointer; }
    .receipt-card { background: #121214; border: 1px dashed #ff334b; padding: 12px; border-radius: 6px; margin-top: 15px; font-size: 0.85rem; }
    .receipt-card h4 { margin: 0 0 10px 0; color: #ff334b; text-align: center; }
  </style>
</head>
<body>

  <div class="header">
    <h1>🥋 TatameOne</h1>
    <p>"Suor no treino, honra no tatame. OSS!"</p>
  </div>

  <div class="tabs">
    <button type="button" class="tab-btn active" data-tab="perfil">Perfil / Dojô</button>
    <button type="button" class="tab-btn" data-tab="pagamentos">Alunos & Caixa</button>
    <button type="button" class="tab-btn" data-tab="stats">📊 Estatísticas</button>
  </div>

  <div id="tab-perfil" class="tab-content active">
    <h3>📜 Dados do Dojô</h3>
    <input type="text" id="nomeDojo" placeholder="Nome da Academia">
    <button type="button" class="form-btn" onclick="alert('Dados salvos!')">Gravar Dados</button>
  </div>

  <div id="tab-pagamentos" class="tab-content">
    <h3>🥋 Cadastro de Aluno</h3>
    <form id="formAluno">
      <label>Nome do Aluno</label>
      <input type="text" id="nomeAluno" placeholder="Ex: João Silva" required>
      
      <label>Faixa Etária</label>
      <select id="idadeAluno">
        <option value="Infantil">Infantil</option>
        <option value="Juvenil">Juvenil</option>
        <option value="Adulto">Adulto</option>
        <option value="Master">Master</option>
      </select>

      <label>Faixa / Graduação</label>
      <select id="faixaAluno">
        <option value="Branca">Branca</option>
        <option value="Azul">Azul</option>
        <option value="Roxa">Roxa</option>
        <option value="Marrom">Marrom</option>
        <option value="Preta">Preta</option>
      </select>

      <label>Valor (R$)</label>
      <input type="number" id="valorPagamento" placeholder="150,00" required>

      <button type="button" class="form-btn" onclick="registrarPagamento()">Gerar Comprovante</button>
    </form>

    <div id="areaComprovante" style="display: none;">
      <div class="receipt-card">
        <h4>🧾 COMPROVANTE</h4>
        <p><strong>Aluno:</strong> <span id="compAluno">-</span></p>
        <p><strong>Idade:</strong> <span id="compIdade">-</span></p>
        <p><strong>Graduação:</strong> <span id="compFaixa">-</span></p>
        <p><strong>Valor:</strong> R$ <span id="compValor">0,00</span></p>
      </div>
    </div>
  </div>

  <div id="tab-stats" class="tab-content">
    <h3>📊 Painel do Tatame</h3>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const buttons = document.querySelectorAll('.tab-btn');
      const contents = document.querySelectorAll('.tab-content');
      buttons.forEach(button => {
        button.addEventListener('click', function(e) {
          e.preventDefault();
          const targetTab = this.getAttribute('data-tab');
          buttons.forEach(b => b.classList.remove('active'));
          contents.forEach(c => c.classList.remove('active'));
          this.classList.add('active');
          document.getElementById('tab-' + targetTab).classList.add('active');
        });
      });
    });

    function registrarPagamento() {
      const nome = document.getElementById('nomeAluno').value;
      const idade = document.getElementById('idadeAluno').value;
      const faixa = document.getElementById('faixaAluno').value;
      const valor = document.getElementById('valorPagamento').value;

      document.getElementById('compAluno').innerText = nome;
      document.getElementById('compIdade').innerText = idade;
      document.getElementById('compFaixa').innerText = faixa;
      document.getElementById('compValor').innerText = parseFloat(valor || 0).toFixed(2);
      document.getElementById('areaComprovante').style.display = 'block';
    }
  </script>
</body>
</html>
