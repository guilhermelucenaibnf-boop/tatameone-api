<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TatameOne - Gestão Completa</title>
  <style>
    body { background-color: #000000; color: #ffffff; font-family: sans-serif; margin: 0; padding: 15px; }
    .header { text-align: center; margin-bottom: 15px; }
    .header h1 { margin: 0; color: #e52e4d; text-transform: uppercase; letter-spacing: 2px; }
    
    .tabs { display: flex; gap: 6px; justify-content: flex-start; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px; }
    .tab-btn { background-color: #1a1a1a; border: 1px solid #333; color: #c4c4cc; padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.75rem; white-space: nowrap; flex-shrink: 0; }
    .tab-btn.active { background-color: #e52e4d; color: #ffffff; border-color: #e52e4d; }
    
    .tab-content { display: none; background: #121214; padding: 16px; border-radius: 8px; border: 1px solid #333; }
    .tab-content.active { display: block !important; }
    
    label { display: block; margin-top: 10px; font-size: 0.8rem; color: #e52e4d; font-weight: bold; }
    input, select, button { width: 100%; padding: 10px; margin-top: 5px; border-radius: 6px; border: 1px solid #333; background: #000; color: #fff; box-sizing: border-box; font-size: 0.9rem; }
    button.btn-main { background: #e52e4d; font-weight: bold; border: none; margin-top: 15px; cursor: pointer; color: #fff; text-transform: uppercase; }
    
    /* ESTILOS DA LISTA DE ALUNOS COM FOTO E EXCLUSÃO */
    .aluno-card { background: #000; border-left: 4px solid #e52e4d; padding: 10px; border-radius: 6px; margin-top: 10px; display: flex; align-items: center; justify-content: space-between; }
    .aluno-info { display: flex; align-items: center; gap: 10px; }
    .aluno-info img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 1px solid #e52e4d; }
    .btn-delete { background: #e52e4d; color: #fff; border: none; padding: 6px 10px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 0.75rem; width: auto; margin: 0; }
    
    .card-stat { background: #000; border: 1px solid #e52e4d; padding: 12px; border-radius: 6px; margin-top: 10px; text-align: center; }
    .card-stat h3 { margin: 0; color: #fff; font-size: 1.5rem; }
    .card-stat p { margin: 5px 0 0 0; color: #8d8d99; font-size: 0.8rem; }
  </style>
</head>
<body>

  <div class="header">
    <h1>🥋 TatameOne</h1>
  </div>

  <div class="tabs">
    <button type="button" class="tab-btn active" onclick="abrirAba('academia')">🏢 Academia</button>
    <button type="button" class="tab-btn" onclick="abrirAba('alunos')">🥋 Alunos & Graduação</button>
    <button type="button" class="tab-btn" onclick="abrirAba('caixa')">💰 Caixa</button>
    <button type="button" class="tab-btn" onclick="abrirAba('pagamento')">💳 Pagamento</button>
    <button type="button" class="tab-btn" onclick="abrirAba('estatisticas')">📊 Estatísticas</button>
  </div>

  <!-- ABA ACADEMIA -->
  <div id="tab-academia" class="tab-content active">
    <h3>🏢 Dados da Academia</h3>
    <label>CNPJ</label>
    <input type="text" id="cnpjAcademia" placeholder="00.000.000/0001-00">
    <label>Endereço Completo</label>
    <input type="text" id="endAcademia" placeholder="Rua, Número, Cidade">
    <label>Horário de Funcionamento</label>
    <div style="display: flex; gap: 8px;">
      <input type="time" id="horaAbertura">
      <input type="time" id="horaFechamento">
    </div>
    <button type="button" class="btn-main" onclick="alert('Dados salvos!')">Salvar Academia</button>
  </div>

  <!-- ABA ALUNOS & GRADUAÇÃO (TUDO EM UMA SÓ ABA) -->
  <div id="tab-alunos" class="tab-content">
    <h3>🥋 Cadastro & Gestão de Alunos</h3>
    
    <label>Foto do Aluno</label>
    <input type="file" id="fotoAlunoInput" accept="image/*">

    <label>Nome Completo</label>
    <input type="text" id="nomeAluno" placeholder="Nome do Aluno">

    <div style="display: flex; gap: 8px;">
      <div style="flex: 1;">
        <label>Faixa Etária</label>
        <select id="catIdade">
          <option value="Infantil">Infantil</option>
          <option value="Juvenil">Juvenil</option>
          <option value="Adulto">Adulto</option>
          <option value="Master">Master</option>
        </select>
      </div>
      <div style="flex: 1;">
        <label>Graduação (Faixa)</label>
        <select id="selFaixa">
          <option value="Branca">Branca</option>
          <option value="Azul">Azul</option>
          <option value="Roxa">Roxa</option>
          <option value="Marrom">Marrom</option>
          <option value="Preta">Preta</option>
        </select>
      </div>
    </div>

    <button type="button" class="btn-main" onclick="cadastrarAluno()">Cadastrar Aluno no Tatame</button>

    <hr style="border: 0.5px solid #333; margin: 20px 0;">

    <h3>📋 Alunos Cadastrados</h3>
    <div id="listaAlunos">
      <p style="color: #8d8d99; font-size: 0.85rem;">Nenhum aluno cadastrado.</p>
    </div>
  </div>

  <!-- ABA CAIXA -->
  <div id="tab-caixa" class="tab-content">
    <h3>💰 Controle de Caixa</h3>
    <label>Descrição do Lançamento</label>
    <input type="text" id="descCaixa" placeholder="Ex: Mensalidade João">
    <label>Valor (R$)</label>
    <input type="number" id="valCaixa" placeholder="150.00">
    <button type="button" class="btn-main" onclick="alert('Lançamento efetuado!')">Lançar no Caixa</button>
  </div>

  <!-- ABA PAGAMENTO -->
  <div id="tab-pagamento" class="tab-content">
    <h3>💳 Formas de Pagamento</h3>
    <label>Método de Pagamento</label>
    <select id="metodoPgto">
      <option value="Pix">PIX</option>
      <option value="Dinheiro">Dinheiro</option>
      <option value="Cartao">Cartão de Crédito/Débito</option>
    </select>
    <label>Chave PIX (Se aplicável)</label>
    <input type="text" id="chavePix" placeholder="CNPJ ou E-mail">
    <button type="button" class="btn-main" onclick="alert('Configuração salva!')">Salvar Pagamento</button>
  </div>

  <!-- ABA ESTATÍSTICAS -->
  <div id="tab-estatisticas" class="tab-content">
    <h3>📊 Painel de Estatísticas</h3>
    <div class="card-stat">
      <h3 id="statAlunos">0</h3>
      <p>Total de Alunos</p>
    </div>
    <div class="card-stat">
      <h3 id="statCaixa">R$ 0,00</h3>
      <p>Saldo em Caixa</p>
    </div>
  </div>

  <script>
    let alunos = [];

    function abrirAba(t) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('tab-' + t).classList.add('active');
    }

    function cadastrarAluno() {
      const nome = document.getElementById('nomeAluno').value.toUpperCase().trim();
      const categoria = document.getElementById('catIdade').value;
      const faixa = document.getElementById('selFaixa').value;
      const fotoInput = document.getElementById('fotoAlunoInput');

      if (!nome) {
        alert('Por favor, digite o nome do aluno!');
        return;
      }

      if (fotoInput.files && fotoInput.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          salvarNovoAluno(nome, categoria, faixa, e.target.result);
        };
        reader.readAsDataURL(fotoInput.files[0]);
      } else {
        salvarNovoAluno(nome, categoria, faixa, '');
      }
    }

    function salvarNovoAluno(nome, categoria, faixa, foto) {
      const id = Date.now();
      alunos.push({ id, nome, categoria, faixa, foto });
      
      // Limpa os campos
      document.getElementById('nomeAluno').value = '';
      document.getElementById('fotoAlunoInput').value = '';

      renderizarAlunos();
    }

    function excluirAluno(id) {
      if (confirm('Deseja realmente excluir este aluno?')) {
        alunos = alunos.filter(a => a.id !== id);
        renderizarAlunos();
      }
    }

    function renderizarAlunos() {
      const container = document.getElementById('listaAlunos');
      document.getElementById('statAlunos').innerText = alunos.length;

      if (alunos.length === 0) {
        container.innerHTML = '<p style="color: #8d8d99; font-size: 0.85rem;">Nenhum aluno cadastrado.</p>';
        return;
      }

      container.innerHTML = '';
      alunos.forEach(a => {
        const fotoTag = a.foto ? `<img src="${a.foto}" alt="Foto">` : `<div style="width:45px;height:45px;border-radius:50%;background:#333;display:flex;align-items:center;justify-content:center;font-size:1.2rem;">🥋</div>`;
        
        container.innerHTML += `
          <div class="aluno-card">
            <div class="aluno-info">
              ${fotoTag}
              <div>
                <strong style="font-size: 0.95rem;">${a.nome}</strong><br>
                <small style="color: #a8a8b3">Faixa ${a.faixa} | ${a.categoria}</small>
              </div>
            </div>
            <button class="btn-delete" onclick="excluirAluno(${a.id})">🗑️ Excluir</button>
          </div>
        `;
      });
    }
  </script>
</body>
</html>
