<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TatameOne</title>
  <style>
    body { background-color: #121214; color: #ffffff; font-family: sans-serif; margin: 0; padding: 15px; }
    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { margin: 0; color: #ff334b; }
    .header p { color: #8d8d99; font-size: 0.9rem; margin-top: 5px; }
    .tabs { display: flex; gap: 8px; justify-content: center; margin-bottom: 20px; position: relative; z-index: 10; }
    .tab-btn { background-color: #202024; border: 1px solid #323238; color: #c4c4cc; padding: 12px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; flex: 1; max-width: 130px; text-align: center; font-size: 0.85rem; -webkit-tap-highlight-color: transparent; }
    .tab-btn.active { background-color: #ff334b; color: #ffffff; border-color: #ff334b; }
    .tab-content { display: none; background: #202024; padding: 16px; border-radius: 8px; border: 1px solid #323238; }
    .tab-content.active { display: block !important; }
    label { display: block; margin-top: 10px; font-size: 0.85rem; color: #a8a8b3; }
    input, select, button.form-btn { width: 100%; padding: 10px; margin-top: 5px; border-radius: 4px; border: 1px solid #323238; background: #121214; color: #fff; box-sizing: border-box; }
    button.form-btn { background: #ff334b; font-weight: bold; border: none; margin-top: 15px; cursor: pointer; }
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    .stat-box { background: #121214; padding: 12px; border-radius: 6px; text-align: center; border: 1px solid #323238; }
    .stat-number { font-size: 1.4rem; font-weight: bold; color: #00b37e; margin-top: 5px; }
  </style>
</head>
<body>

  <div class="header">
    <h1>🥋 TatameOne</h1>
    <p>"Suor no treino, honra no tatame. OSS!"</p>
  </div>

  <!-- Navegação por Abas -->
  <div class="tabs">
    <button type="button" class="tab-btn active" data-tab="perfil">Perfil / Dojô</button>
    <button type="button" class="tab-btn" data-tab="pagamentos">Alunos & Caixa</button>
    <button type="button" class="tab-btn" data-tab="stats">📊 Estatísticas</button>
  </div>

  <!-- ABA 1: PERFIL -->
  <div id="tab-perfil" class="tab-content active">
    <h3>📜 Dados do Dojô / Professor</h3>
    <form id="formPerfil">
      <label>Tipo de Registro</label>
      <select id="tipoPessoa">
        <option value="PJ">Pessoa Jurídica (Academia / CNPJ)</option>
        <option value="PF">Pessoa Física (Professor / CPF)</option>
      </select>
      <label>Nome da Academia / Dojô</label>
      <input type="text" placeholder="Ex: Academia Team TatameOne">
      <label>Documento (CPF ou CNPJ)</label>
      <input type="text" placeholder="00.000.000/0001-00">
      <label>Chave PIX</label>
      <input type="text" placeholder="CPF, CNPJ, E-mail ou Celular">
      <label>Endereço do Tatame</label>
      <input type="text" placeholder="Rua, Número, Bairro, Cidade">
      <button type="button" class="form-btn">Gravar Dados no Tatame</button>
    </form>
  </div>

  <!-- ABA 2: ALUNOS & CAIXA -->
  <div id="tab-pagamentos" class="tab-content">
    <h3>🥋 Gestão de Alunos e Caixa</h3>
    <p style="color: #a8a8b3; font-size: 0.9rem;">Área de cobranças e matrículas.</p>
    <div id="listaPagamentos">
      <p style="color: #8d8d99; font-size: 0.85rem;">Nenhum registro no caixa no momento.</p>
    </div>
  </div>

  <!-- ABA 3: ESTATÍSTICAS -->
  <div id="tab-stats" class="tab-content">
    <h3>📊 Painel do Tatame</h3>
    <div class="stats-grid">
      <div class="stat-box">
        <div>Alunos Ativos</div>
        <div class="stat-number">0</div>
      </div>
      <div class="stat-box">
        <div>Caixa do Mês</div>
        <div class="stat-number">R$ 0,00</div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const buttons = document.querySelectorAll('.tab-btn');
      const contents = document.querySelectorAll('.tab-content');

      buttons.forEach(button => {
        button.addEventListener('click', function(e) {
          e.preventDefault();
          const targetTab = this.getAttribute('data-tab');

          // Desativa todos os botões e abas
          buttons.forEach(b => b.classList.remove('active'));
          contents.forEach(c => c.classList.remove('active'));

          // Ativa o botão e a aba correspondente
          this.classList.add('active');
          const targetContent = document.getElementById('tab-' + targetTab);
          if (targetContent) {
            targetContent.classList.add('active');
          }
        });
      });
    });
  </script>
</body>
</html>
