<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TatameOne</title>
  <link rel="manifest" href="/manifest.json">
  <style>
    :root {
      --bg: #121214;
      --card-bg: #202024;
      --primary: #8257e5;
      --text: #e1e1e6;
      --subtext: #a8a8b3;
      --success: #04d361;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; max-width: 600px; margin: 0 auto; padding-bottom: 40px; }
    h1 { color: var(--primary); text-align: center; margin-bottom: 16px; }
    
    /* Menu de Abas */
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .tab-btn { flex: 1; padding: 10px; background: var(--card-bg); border: 1px solid #29292e; color: var(--subtext); border-radius: 6px; cursor: pointer; font-weight: bold; text-align: center; }
    .tab-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .card { background: var(--card-bg); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    h3 { margin-bottom: 12px; color: #fff; }
    label { display: block; margin-bottom: 6px; color: var(--subtext); font-size: 0.85rem; }
    input, select, button { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 6px; border: none; background: #121214; color: #fff; font-size: 0.95rem; }
    button { background: var(--primary); font-weight: bold; cursor: pointer; margin-top: 8px; }
    button:active { opacity: 0.8; }
    
    .item { border-bottom: 1px solid #29292e; padding: 10px 0; display: flex; justify-content: space-between; align-items: center; }
    .item:last-child { border-bottom: none; }
    .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
    .badge-pago { background: #0e3a2f; color: var(--success); }
    .badge-pendente { background: #4a2810; color: #ff9900; }
  </style>
</head>
<body>

  <h1>🥋 TatameOne</h1>

  <!-- Navegação por Abas -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('perfil')">Perfil / Academia</button>
    <button class="tab-btn" onclick="switchTab('pagamentos')">Pagamentos</button>
  </div>

  <!-- ABA PERFIL / ACADEMIA -->
  <div id="tab-perfil" class="tab-content active">
    <div class="card">
      <h3>Dados do Perfil</h3>
      <form id="formPerfil">
        <label>Tipo de Cadastro</label>
        <select id="tipoPessoa" onchange="toggleTipoPessoa()">
          <option value="PJ">Pessoa Jurídica (Academia / CNPJ)</option>
          <option value="PF">Pessoa Física (Instrutor / CPF)</option>
        </select>

        <label id="lblNome">Nome da Academia</label>
        <input type="text" id="nomePerfil" placeholder="Ex: Gracie Barra Central" required>

        <label id="lblDoc">CNPJ</label>
        <input type="text" id="docPerfil" placeholder="00.000.000/0001-00" required>

        <label>Endereço Completo</label>
        <input type="text" id="enderecoPerfil" placeholder="Rua, Número, Bairro, Cidade" required>

        <button type="submit">Salvar Perfil</button>
      </form>
    </div>
  </div>

  <!-- ABA PAGAMENTOS -->
  <div id="tab-pagamentos" class="tab-content">
    <div class="card">
      <h3>Novo Pagamento</h3>
      <form id="formPagamento">
        <label>Nome do Aluno</label>
        <input type="text" id="pagAluno" placeholder="Ex: João Silva" required>

        <label>Valor (R$)</label>
        <input type="number" step="0.01" id="pagValor" placeholder="150.00" required>

        <label>Status</label>
        <select id="pagStatus">
          <option value="Pago">Pago</option>
          <option value="Pendente">Pendente</option>
        </select>

        <button type="submit">Registrar Pagamento</button>
      </form>
    </div>

    <div class="card">
      <h3>Histórico de Pagamentos</h3>
      <div id="listaPagamentos">Carregando...</div>
    </div>
  </div>

  <script>
    const API_URL = 'https://tatameone-api.onrender.com';

    // Troca entre PJ e PF nos campos do formulário
    function toggleTipoPessoa() {
      const tipo = document.getElementById('tipoPessoa').value;
      const lblNome = document.getElementById('lblNome');
      const lblDoc = document.getElementById('lblDoc');
      const docInput = document.getElementById('docPerfil');

      if (tipo === 'PF') {
        lblNome.innerText = 'Nome Completo do Responsável / Instrutor';
        lblDoc.innerText = 'CPF';
        docInput.placeholder = '000.000.000-00';
      } else {
        lblNome.innerText = 'Nome da Academia';
        lblDoc.innerText = 'CNPJ';
        docInput.placeholder = '00.000.000/0001-00';
      }
    }

    // Troca de Abas
    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      
      event.target.classList.add('active');
      document.getElementById(`tab-${tab}`).classList.add('active');

      if (tab === 'pagamentos') fetchPagamentos();
    }

    // --- PERFIL (PF / PJ) ---
    document.getElementById('formPerfil').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        tipoPessoa: document.getElementById('tipoPessoa').value,
        nome: document.getElementById('nomePerfil').value,
        documento: document.getElementById('docPerfil').value,
        endereco: document.getElementById('enderecoPerfil').value
      };

      try {
        await fetch(`${API_URL}/academia`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        alert('Perfil salvo com sucesso!');
      } catch (err) {
        alert('Erro ao salvar perfil.');
      }
    });

    // --- PAGAMENTOS ---
    async function fetchPagamentos() {
      const container = document.getElementById('listaPagamentos');
      try {
        const res = await fetch(`${API_URL}/pagamentos`);
        const data = await res.json();

        if (!Array.isArray(data) || data.length === 0) {
          container.innerHTML = '<p style="color: var(--subtext)">Nenhum pagamento registrado.</p>';
          return;
        }

        container.innerHTML = data.map(item => `
          <div class="item">
            <div>
              <strong>${item.aluno || item.nome}</strong><br>
              <small style="color: var(--subtext)">R$ ${item.valor}</small>
            </div>
            <span class="badge ${item.status === 'Pago' ? 'badge-pago' : 'badge-pendente'}">${item.status}</span>
          </div>
        `).join('');
      } catch (err) {
        container.innerHTML = '<p style="color: #f75a68">Erro ao carregar pagamentos.</p>';
      }
    }

    document.getElementById('formPagamento').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        aluno: document.getElementById('pagAluno').value,
        valor: document.getElementById('pagValor').value,
        status: document.getElementById('pagStatus').value
      };

      try {
        await fetch(`${API_URL}/pagamentos`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        document.getElementById('pagAluno').value = '';
        document.getElementById('pagValor').value = '';
        fetchPagamentos();
      } catch (err) {
        alert('Erro ao registrar pagamento.');
      }
    });
  </script>
</body>
</html>
